<text x="808" y="440" font-size="9.4" font-weight="800" fill="#5C6AC4">Pourquoi deux voies ?</text>
<text x="808" y="458" font-size="8.8" fill="#5B6B82">La liquidité se mesure</text>
<text x="808" y="472" font-size="8.8" fill="#5B6B82">à la seconde ; le climat de</text>
<text x="808" y="486" font-size="8.8" fill="#5B6B82">marché change une fois par</text>
<text x="808" y="500" font-size="8.8" fill="#5B6B82">jour. Je ne mélange pas les</text>
